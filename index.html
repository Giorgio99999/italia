 conquista la zona e fonda Tridentum, la futura Trento, lungo la via Claudia Augusta."},{anno:"1027 – 1400",titolo:"Medioevo",testo:"Nasce il Principato vescovile di Trento. Nel nord si affermano i conti del Tirolo."},{anno:"1545 – 1563",titolo:"Il Concilio di Trento",testo:"Il Concilio riunisce la Chiesa cattolica in un momento decisivo e trasforma Trento in capitale europea del dibattito."},{anno:"1918 – 1919",titolo:"Risorgimento e Unità",testo:"Dopo la Prima guerra mondiale Trentino e Alto Adige entrano nel Regno d’Italia, completando il confine al Brennero."},{anno:"1972 – oggi",titolo:"Novecento e oggi",testo:"L’autonomia speciale e la convivenza tra lingue diventano un modello europeo. Turismo e montagna trainano l’economia."}],curiosita:["Ha due province autonome: Trento e Bolzano.","Le Dolomiti sono Patrimonio UNESCO.","Qui si parla italiano, tedesco e ladino."],personaggi:[{nome:"Alcide De Gasperi",nota:"Statista trentino, padre della Repubblica e dell’Europa."},{nome:"Gustav Mahler",nota:"Compositore legato alle estati in Val Pusteria."}],vedere:["Il Castello del Buonconsiglio a Trento","Piazza Walther e i mercatini di Bolzano","Le Tre Cime di Lavaredo e la Val Gardena"]},{id:"veneto",nome:"Veneto",capoluogo:"Venezia",soprannome:"La Serenissima",colore:"#b65b2e",intro:"Dalla laguna alle Dolomiti, il Veneto è stato per mille anni una repubblica marinara che commerciava con il mondo intero.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"I Veneti abitano la pianura. Con Roma, città come Padova e Verona diventano fiorenti centri urbani."},{anno:"421",titolo:"La nascita di Venezia",testo:"Secondo la tradizione, le prime comunità si rifugiano in laguna durante le invasioni. Nasce una città sull’acqua."},{anno:"697 – 1200",titolo:"Medioevo",testo:"Venezia elegge il primo doge e costruisce una potenza marinara. Padova e Verona vivono la stagione dei Comuni e delle signorie."},{anno:"1400 – 1600",titolo:"La Serenissima",testo:"Venezia domina mari, commerci e arte: è l’età di Tiziano, Tintoretto e Veronese, e delle ville palladiane in terraferma."},{anno:"1797 – 1866",titolo:"Risorgimento e Unità",testo:"Dopo la caduta della Repubblica e il dominio austriaco, il Veneto entra nel Regno d’Italia nel 1866."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Da terra di emigrazione a terra di imprese, turismo e cultura: Venezia resta una delle città più amate al mondo."}],curiosita:["Venezia non ha strade per le auto nel centro storico: si va a piedi o in barca.","Il Carnevale di Venezia è famoso in tutto il mondo.","Il prosecco nasce nelle colline tra Conegliano e Valdobbiadene."],personaggi:[{nome:"Marco Polo",nota:"Viaggiatore veneziano, autore de “Il Milione”."},{nome:"Andrea Palladio",nota:"Architetto che ha cambiato l’architettura europea."},{nome:"Antonio Vivaldi",nota:"Compositore de “Le quattro stagioni”."}],vedere:["Piazza San Marco e il Canal Grande","L’Arena e il centro di Verona","Le ville palladiane e le Dolomiti bellunesi"]},{id:"friuli-veneziagiulia",nome:"Friuli-Venezia Giulia",capoluogo:"Trieste",soprannome:"La terra di confine",colore:"#4a6b7a",intro:"Tra Alpi, mare e Mitteleuropa, questa regione è un incontro di lingue e culture: italiana, slovena, tedesca e friulana.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"Celti e Carni abitano la zona. Roma fonda Aquileia, uno dei porti e delle città più importanti dell’Impero."},{anno:"IV – V secolo",titolo:"Epoca romana e invasioni",testo:"Aquileia è crocevia di strade e commerci. Le invasioni ne segnano la crisi e la trasformazione."},{anno:"1077 – 1420",titolo:"Medioevo",testo:"Nasce il Patriarcato di Aquileia, uno Stato potente che governa gran parte del Friuli."},{anno:"1420 – 1800",titolo:"Venezia e Asburgo",testo:"La regione si divide tra la Repubblica di Venezia e l’Impero asburgico. Trieste cresce come porto imperiale."},{anno:"1866 – 1918",titolo:"Risorgimento e Unità",testo:"Il Friuli entra nel Regno d’Italia nel 1866. T ue borghi collegati da sentieri sul mare.","Il pesto nasce a Genova, con basilico, pinoli e aglio.","Cristoforo Colombo era genovese."],personaggi:[{nome:"Cristoforo Colombo",nota:"Navigatore che nel 1492 raggiunge l’America."},{nome:"Giuseppe Mazzini",nota:"Pensatore e patriota del Risorgimento."},{nome:"Fabrizio De André",nota:"Cantautore, voce di Genova."}],vedere:["Il centro storico e l’Acquario di Genova","Portofino e il Golfo del Tigullio","Le Cinque Terre e la Riviera di Ponente"]},{id:"emilia-romagna",nome:"Emilia-Romagna",capoluogo:"Bologna",soprannome:"La terra della buona tavola",colore:"#b13a3a",intro:"La via Emilia attraversa una delle regioni più ricche di arte, musica e cucina d’Italia, da Bologna a Ravenna, da Parma a Ferrara.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"Etruschi, Celti e Umbri abitano la pianura. La via Emilia, costruita da Roma, unisce le città della regione."},{anno:"187 a.C.",titolo:"Epoca romana",testo:"Roma fonda colonie e costruisce strade. Bologna, Modena, Parma e Piacenza diventano città importanti."},{anno:"402 – 751",titolo:"Medioevo",testo:"Ravenna diventa capitale dell’Impero d’Occidente e poi del regno bizantino in Italia, con mosaici unici al mondo."},{anno:"1100 – 1500",titolo:"Comuni e signorie",testo:"Bologna fonda la prima università d’Europa. A Ferrara gli Este fanno fiorire arte e letteratura."},{anno:"1848 – 1860",titolo:"Risorgimento e Unità",testo:"Ducati e Legazioni si uniscono al Regno di Sardegna. L’Emilia-Romagna entra nell’Italia unita."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"La regione diventa simbolo di qualità della vita, cooperazione, motori, musica e grande cucina."}],curiosita:["L’Università di Bologna, fondata nel 1088, è la più antica del mondo occidentale.","I mosaici di Ravenna sono Patrimonio UNESCO.","Tortellini, lasagne e ragù nascono in questa terra."],personaggi:[{nome:"Giuseppe Verdi",nota:"Compositore nato a Le Roncole, vicino a Parma."},{nome:"Federico Fellini",nota:"Regista riminese, autore di capolavori del cinema."},{nome:"Luciano Pavarotti",nota:"Tenore modenese amato in tutto il mondo."}],vedere:["Piazza Maggiore e i portici di Bologna","I mosaici di Ravenna","Ferrara, Parma e la Motor Valley"]},{id:"toscana",nome:"Toscana",capoluogo:"Firenze",soprannome:"La culla del Rinascimento",colore:"#c08a2d",intro:"Colline, cipressi, città d’arte e borghi medievali. In Toscana nasce la lingua italiana e fiorisce il Rinascimento con i Medici.",timeline:[{anno:"VIII secolo a.C.",titolo:"Origini antiche",testo:"Gli Etruschi costruiscono città, strade e tombe affrescate. La loro cultura influenza profondamente Roma."},{anno:"I secolo a.C.",titolo:"Epoca romana",testo:"Roma fonda Florentia, l’odierna Firenze, e sviluppa città come Siena, Pisa e Arezzo."},{anno:"1100 – 1300",titolo:"Medioevo",testo:"I Comuni toscani diventano ricchi con commerci e banche. Dante scrive in volgare toscano."},{anno:"1434 – 1737",titolo:"I Medici e il Rinascimento",testo:"La famiglia Medici governa Firenze e sostiene Brunelleschi, Botticelli, Michelangelo e Leonardo."},{anno:"1848 – 1860",titolo:"Risorgimento e Unità",testo:"La Toscana partecipa ai moti risorgimentali. Nel 1860 vota l’annessione al Regno di Sardegna."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Arte, paesaggio, vino e turismo fanno della Toscana una delle regioni più visitate e amate del mondo."}],curiosita:["La lingua italiana nasce dal fiorentino di Dante.","La Torre di Pisa pende per un cedimento del terreno.","Il Chianti è tra i vini più conosciuti al mondo."],personaggi:[{nome:"Dante Alighieri",nota:"Poeta, autore della Divina Commedia."},{nome:"Leonardo da Vinci",nota:"Artista e scienziato nato a Vinci."},{nome:"Michelangelo Buonarroti",nota:"Scultore e pittore della Cappella Sistina."}],vedere:["Gli Uffizi e il Duomo di Firenze","Piazza del Campo a Siena","La Val d’Orcia e la Torre di Pisa"]},{id:"umbria",nome:"Umbria",capoluogo:"Perugia",soprannome:"Il cuore verde d’Italia",colore:"#5f7f3f",intro:"L’unica regione senza mare, ma con un cuore verde di colline, laghi e borghi. Qui vive san Francesco, il santo più amato d’Italia.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"Gli Umbri sono tra i popoli più antichi della penisola. Le Tavole Eugubine raccontano la loro lingua e i loro riti."},{anno:"III secolo a.C.",titolo:"Epoca romana",testo:"Roma conquista l’Umbria e la collega con la via Flaminia. Perugia, Orvieto e Spoleto diventano città importanti."},{anno:"1182",titolo:"Medioevo",testo:"Ad Assisi nasce Francesco, figlio di un mercante, che sceglie povertà e pace e fonda l’ordine francescano."},{anno:"1300 – 1500",titolo:"Comuni e arte",testo:"Perugia, Assisi, Orvieto e Spoleto vivono una stagione di arte e architettura. Nasce la scuola umbra di pittura."},{anno:"1860",titolo:"Risorgimento e Unità",testo:"Dopo il dominio pontificio, l’Umbria vota l’annessione al Regno di Sardegna e poi al Regno d’Italia."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"L’Umbria unisce spiritualità, natura e buona tavola, con festival come Umbria Jazz e il Festival dei Due Mondi."}],curiosita:["È l’unica regione italiana senza sbocco sul mare.","Il lago Trasimeno è il quarto lago d’Italia per superficie.","Ad Assisi la Basilica di San Francesco è meta di pellegrini da tutto il mondo."],personaggi:[{nome:"San Francesco d’Assisi",nota:"Santo, poeta del Cantico delle creature."},{nome:"Santa Chiara",nota:"Fondatrice delle Clarisse."},{nome:"Pietro Vannucci, il Perugino",nota:"Maestro di Raffaello."}],vedere:["Assisi e la Basilica di San Francesco","Orvieto e la sua cattedrale","Perugia, Spoleto e il lago Trasimeno"]},{id:"marche",nome:"Marche",capoluogo:"Ancona",soprannome:"L’Italia in una regione",colore:"#7d5a8a",intro:"Mare, colline, montagne e borghi: nelle Marche c’è un po’ di tutta l’Italia, con Urbino, gioiello del Rinascimento.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"Piceni e Senoni abitano la zona. Ancona, fondata dai Greci di Siracusa, diventa un porto importante."},{anno:"III secolo a.C.",titolo:"Epoca romana",testo:"Roma conquista la regione e la attraversa con la via Flaminia e la via Salaria."},{anno:"774 – 1200",titolo:"Medioevo",testo:"Nascono i Comuni e le signorie. La Marca di Ancona diventa un territorio di confine tra Papato e Impero."},{anno:"1444 – 1508",titolo:"Urbino e il Rinascimento",testo:"Federico da Montefeltro fa di Urbino una delle corti più raffinate d’Europa, con Raffaello e Piero della Francesca."},{anno:"1860",titolo:"Risorgimento e Unità",testo:"Dopo la battaglia di Castelfidardo, le Marche entrano nel Regno di Sardegna e poi nel Regno d’Italia."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Piccole imprese, calzature, mare e borghi rendono le Marche una regione da scoprire, tra Adriatico e Sibillini."}],curiosita:["Il nome “Marche” viene dalla Marca di Ancona.","La Santa Casa di Loreto è tra i santuari più visitati d’Italia.","Giacomo Leopardi nasce a Recanati."],personaggi:[{nome:"Raffaello Sanzio",nota:"Pittore nato a Urbino."},{nome:"Giacomo Leopardi",nota:"Poeta di Recanati."},{nome:"Gioachino Rossini",nota:"Compositore nato a Pesaro."}],vedere:["Urbino e il Palazzo Ducale","Loreto e le Grotte di Frasassi","Ancona, Ascoli Piceno e il Conero"]},{id:"lazio",nome:"Lazio",capoluogo:"Roma",soprannome:"La Città Eterna e la sua terra",colore:"#a63b2e",intro:"Il Lazio è la terra di Roma: dalla Roma antica alla Roma dei papi, qui si è scritta gran parte della storia d’Italia e d’Europa.",timeline:[{anno:"753 a.C.",titolo:"Origini antiche",testo:"Secondo la leggenda, Romolo fonda Roma sulle rive del Tevere. Latini, Etruschi e Sabini abitano la regione."},{anno:"509 a.C. – 476 d.C.",titolo:"Epoca romana",testo:"Da piccola città a capitale di un impero: Roma costruisce strade, acquedotti, fori, anfiteatri e leggi che durano ancora."},{anno:"800 – 1300",titolo:"Medioevo",testo:"Roma diventa centro della cristianità. I papi governano la città e lo Stato della Chiesa."},{anno:"1500 – 1600",titolo:"Rinascimento e Roma papale",testo:"Con Giulio II e i papi del Cinquecento, Roma torna capitale dell’arte: Michelangelo, Raffaello e Bernini la trasformano."},{anno:"1870",titolo:"Risorgimento e Unità",testo:"La breccia di Porta Pia unisce Roma all’Italia. Nel 1871 Roma diventa capitale del Regno d’Italia."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Roma è capitale della Repubblica, sede del Vaticano e una delle città più visitate al mondo."}],curiosita:["Roma è chiamata la Città Eterna.","Il Colosseo poteva ospitare decine di migliaia di spettatori.","La Fontana di Trevi è legata alla tradizione della monetina."],personaggi:[{nome:"Giulio Cesare",nota:"Condottiero e statista della Roma antica."},{nome:"Gian Lorenzo Bernini",nota:"Scultore e architetto della Roma barocca."},{nome:"Alberto Moravia",nota:"Scrittore romano del Novecento."}],vedere:["Colosseo, Fori e Pantheon a Roma","La Basilica di San Pietro e i Musei Vaticani","Tivoli, Villa d’Este e Villa Adriana"]},{id:"abruzzo",nome:"Abruzzo",capoluogo:"L'Aquila",soprannome:"La regione dei parchi",colore:"#4d7a52",intro:"Montagne alte, parchi naturali, borghi di pietra e un mare limpido: l’Abruzzo è la regione più verde d’Europa per aree protette.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"Sanniti, Marsi, Peligni e Vestini abitano montagne e valli. I Marsi sono famosi come guerrieri e guaritori."},{anno:"IV – I secolo a.C.",titolo:"Epoca romana",testo:"Roma conquista la zona dopo le guerre sannitiche. Nascono città, strade e terme."},{anno:"Medioevo",titolo:"Medioevo",testo:"Castelli, abbazie e borghi fortificati punteggiano la regione. La transumanza collega montagne e Puglia."},{anno:"1200 – 1500",titolo:"Regno di Napoli",testo:"L’Abruzzo entra nel Regno di Napoli. L’Aquila, fondata nel XIII secolo, diventa un centro ricco e vivace."},{anno:"1860 – 1861",titolo:"Risorgimento e Unità",testo:"L’Abruzzo segue le sorti del Regno delle Due Sicilie e entra nel Regno d’Italia."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Parchi, orsi marsicani, sci e borghi fanno dell’Abruzzo un luogo di natura e memoria, anche dopo il terremoto del 2009."}],curiosita:["Un terzo del territorio è protetto da parchi e riserve.","Il Gran Sasso è la vetta più alta degli Appennini.","La transumanza è Patrimonio UNESCO."],personaggi:[{nome:"Gabriele D’Annunzio",nota:"Poeta e scrittore nato a Pescara."},{nome:"Ignazio Silone",nota:"Scrittore abruzzese, autore di “Fontamara”."}],vedere:["Il Gran Sasso e il Parco Nazionale d’Abruzzo","L’Aquila e Sulmona","Rocca Calascio e la Costa dei Trabocchi"]},{id:"molise",nome:"Molise",capoluogo:"Campobasso",soprannome:"La regione che non esiste — ma esiste",colore:"#8a7a3f",intro:"Piccolo e autentico, il Molise è fatto di borghi, tratturi, castelli e tradizioni. È la regione più giovane d’Italia per autonomia.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"I Sanniti abitano le montagne molisane. Pietrabbondante conserva il teatro-tempio più importante del mondo sannita."},{anno:"III – I secolo a.C.",titolo:"Epoca romana",testo:"Dopo le guerre sannitiche, Roma fonda città e costruisce strade. Saepinum diventa un importante centro agricolo."},{anno:"Medioevo",titolo:"Medioevo",testo:"Longobardi e Normanni governano la zona. Nascono castelli, contee e il nome “Molise” da una famiglia nobile."},{anno:"1200 – 1800",titolo:"Regno di Napoli",testo:"Il Molise fa parte del Regno di Napoli. La transumanza e l’agricoltura segnano la vita delle comunità."},{anno:"1861",titolo:"Risorgimento e Unità",testo:"Il Molise entra nel Regno d’Italia insieme all’Abruzzo e al resto del Sud."},{anno:"1963 – oggi",titolo:"Novecento e oggi",testo:"Nel 1963 il Molise diventa regione autonoma, separandosi dall’Abruzzo. Oggi è simbolo di borghi lenti e natura."}],curiosita:["È la seconda regione più piccola d’Italia.","Il Molise è diventato regione autonoma nel 1963.","Campobasso è famosa per la lavorazione dell’acciaio e le lame."],personaggi:[{nome:"Francesco Jovine",nota:"Scrittore molisano, autore de “Le terre del Sacramento”."},{nome:"Eugenio Cirese",nota:"Poeta e studioso delle tradizioni molisane."}],vedere:["Saepinum e il teatro di Pietrabbondante","Campobasso e il Castello Monforte","Agnone e le campane della Fonderia Marinelli"]},{id:"campania",nome:"Campania",capoluogo:"Napoli",soprannome:"La terra del sole e del mare",colore:"#d97a1f",intro:"Dalla Magna Grecia al Regno di Napoli, la Campania è teatro, musica, archeologia e sapori. Napoli è una delle città più antiche e vive d’Europa.",timeline:[{anno:"VIII secolo a.C.",titolo:"Origini antiche",testo:"I Greci fondano Cuma e Neápolis, la “città nuova”: nasce Napoli. La Campania è terra di Magna Grecia."},{anno:"IV secolo a.C. – 79 d.C.",titolo:"Epoca romana",testo:"Roma conquista la regione. Nel 79 d.C. il Vesuvio seppellisce Pompei ed Ercolano, conservandole per noi."},{anno:"Medioevo",titolo:"Medioevo",testo:"Ducati, Longobardi, Normanni e Svevi si succedono. Napoli cresce come capitale e porto del Mediterraneo."},{anno:"1266 – 1800",titolo:"Il Regno di Napoli",testo:"Angioini, Aragonesi e Borbone fanno di Napoli una delle capitali più grandi e vivaci d’Europa."},{anno:"1860 – 1861",titolo:"Risorgimento e Unità",testo:"Garibaldi sbarca in Sicilia e arriva a Napoli. Il Regno delle Due Sicilie entra nel Regno d’Italia."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Napoli resta capitale di musica, teatro e cucina. Pompei, la Costiera Amalfitana e Capri attirano il mondo."}],curiosita:["La pizza nasce a Napoli.","Pompei è uno dei siti archeologici più visitati al mondo.","Il dialetto napoletano ha una tradizione teatrale e musicale antichissima."],personaggi:[{nome:"Giordano Bruno",nota:"Filosofo nato a Nola."},{nome:"Totò",nota:"Attore e principe della risata napoletana."},{nome:"Eduardo De Filippo",nota:"Drammaturgo, autore di “Napoli milionaria!”."}],vedere:["Napoli, Spaccanapoli e il Museo Archeologico","Pompei, Ercolano e il Vesuvio","La Costiera Amalfitana e Capri"]},{id:"puglia",nome:"Puglia",capoluogo:"Bari",soprannome:"Il tacco d’Italia",colore:"#c9a13a",intro:"Terra di ulivi, trulli, masserie e castelli. La Puglia è stata ponte tra Oriente e Occidente, con Federico II e le Crociate.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"Messapi, Dauni e Peuceti abitano la regione. I Greci fondano colonie come Taranto, una delle più ricche della Magna Grecia."},{anno:"III secolo a.C.",titolo:"Epoca romana",testo:"Roma conquista la Puglia e la collega con la via Appia e la via Traiana, verso Brindisi e l’Oriente."},{anno:"Medioevo",titolo:"Medioevo",testo:"Bizantini, Longobardi e Normanni si contendono la regione. Bari diventa meta di pellegrini per le reliquie di San Nicola."},{anno:"1194 – 1250",titolo:"Federico II e i castelli",testo:"L’imperatore Federico II costruisce castelli e città, tra cui Castel del Monte, e fa della Puglia un centro di cultura."},{anno:"1860 – 1861",titolo:"Risorgimento e Unità",testo:"La Puglia entra nel Regno d’Italia dopo la caduta del Regno delle Due Sicilie."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Agricoltura, mare, trulli e borghi bianchi fanno della Puglia una delle mete più amate d’Italia."}],curiosita:["Gli ulivi pugliesi sono tra i più antichi d’Italia.","I trulli di Alberobello sono Patrimonio UNESCO.","Castel del Monte ha una pianta ottagonale unica."],personaggi:[{nome:"Federico II di Svevia",nota:"Imperatore, detto “Stupor Mundi”."},{nome:"San Nicola di Bari",nota:"Santo venerato in Oriente e in Occidente."},{nome:"Domenico Modugno",nota:"Cantautore di “Nel blu, dipinto di blu”."}],vedere:["Alberobello e i trulli","Castel del Monte e Bari Vecchia","Lecce, Ostuni e il Salento"]},{id:"basilicata",nome:"Basilicata",capoluogo:"Potenza",soprannome:"La terra dei Sassi",colore:"#8a5a2e",intro:"Montagne, calanchi e borghi scavati nella roccia. La Basilicata è una terra antica e sorprendente, con Matera tra le città più antiche del mondo.",timeline:[{anno:"Antichità",titolo:"Origini antiche",testo:"Lucani e Greci abitano la zona. Metaponto, colonia greca, diventa un centro di cultura e agricoltura."},{anno:"III secolo a.C.",titolo:"Epoca romana",testo:"Roma conquista la Lucania. La via Appia attraversa la regione e collega Roma a Brindisi."},{anno:"Medioevo",titolo:"Medioevo",testo:"Bizantini, Longobardi e Normanni governano la regione. Nascono castelli, abbazie e borghi fortificati."},{anno:"1200 – 1800",titolo:"Regno di Napoli",testo:"La Basilicata fa parte del Regno di Napoli. Matera cresce con i Sassi, case scavate nella roccia."},{anno:"1861",titolo:"Risorgimento e Unità",testo:"La Basilicata entra nel Regno d’Italia. È anche terra di brigantaggio e di grande emigrazione."},{anno:"Novecento – oggi",titolo:"Novecento e oggi",testo:"Da terra di povertà a terra di cultura: nel 2019 Matera è Capitale europea della cultura."}],curiosita:["Matera è abitata da migliaia di anni.","I Sassi di Matera sono Patrimonio UNESCO.","Le Dolomiti Lucane sono montagne dalle forme spettacolari."],personaggi:[{nome:"Carlo Levi",nota:"Scrittore, autore di “Cristo si è fermato a Eboli”."},{nome:"Orazio",nota:"Poeta latino nato a Venosa."}],vedere:["I Sassi e il Parco della Murgia a Matera","Potenza e Castelmezzano","Metaponto e Maratea"]},{id:"calabria",nome:"Calabria",capoluogo:"Catanzaro",soprannome:"La punta dello Stivale",colore:"#3f7a4a",intro:"Tra due mari, montagne e borghi antichi. La Calabria è la terra dei Bronzi di Riace e della Magna Grecia, con spiagge e boschi della Sila.",timeline:[{anno:"VIII secolo a.C.",titolo:"Origini antiche",testo:"I Greci fondano Sibari, Crotone, Locri e Reggio. La Calabria è cuore della Magna Grecia."},{anno:"III secolo a.C.",titolo:"Epoca romana",testo:"Roma conquista la regione e la chiama Bruttium. Reggio diventa un porto importante verso la Sicilia."},{anno:"Medioevo",
